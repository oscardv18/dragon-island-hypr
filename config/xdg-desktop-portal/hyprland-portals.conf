# dragon-island — portal backends for the Hyprland session only
# (read when XDG_CURRENT_DESKTOP=Hyprland; Plasma uses kde-portals.conf).
#
# Same as /usr/share/xdg-desktop-portal/hyprland-portals.conf, plus the Secret portal,
# which neither hyprland nor gtk implement: served by gnome-keyring, the session's only
# Secret Service, so sandboxed apps get their secrets from the "login" keyring too.
#
# FileChooser: Dragon Portal (the Dragon explorer as the file dialog of Brave, Telegram…, docs/PORTAL-API.md). «dragon» only
# exists once migration 102 / `core` registers ~/.local/share/xdg-desktop-portal/portals/dragon.portal; without it
# xdg-desktop-portal skips the name and uses «gtk» (probed). dragon-portal itself falls back to gtk when the explorer fails.
# Turn it off: scripts/portal-rollback.sh (removes the .portal; this line can stay).
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.FileChooser=dragon;gtk
