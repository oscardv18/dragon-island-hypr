# dragon-island — Brave flags (read by the brave-bin wrapper /usr/bin/brave from
# ${XDG_CONFIG_HOME:-~/.config}/brave-flags.conf; one flag per line, '#' = comment).
#
# Same password store in Plasma and Hyprland: gnome-keyring through libsecret (the only
# Secret Service on this desktop, unlocked at login by PAM). Without it Brave picks
# KWallet in Plasma and another store in Hyprland, so each session can't read the other's.
--password-store=gnome-libsecret
