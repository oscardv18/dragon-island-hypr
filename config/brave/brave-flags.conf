# dragon-island — Brave flags (read by the brave-bin wrapper /usr/bin/brave from
# ${XDG_CONFIG_HOME:-~/.config}/brave-flags.conf; one flag per line, '#' = comment).
#
# Same password store in Plasma and Hyprland: KWallet 6. Plasma picks it on its own;
# under Hyprland Chromium would fall back to another store and could not decrypt the
# cookies/passwords saved from Plasma. The wallet is unlocked at login (pam_kwallet5).
--password-store=kwallet6
