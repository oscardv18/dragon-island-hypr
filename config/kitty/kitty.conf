# =============================================================================
# dragon-island — kitty terminal configuration
# Sweet / Garuda Dragonized palette
# =============================================================================

# Typography
font_family      JetBrains Mono Nerd Font
bold_font        JetBrains Mono Nerd Font Bold
italic_font      JetBrains Mono Nerd Font Italic
bold_italic_font JetBrains Mono Nerd Font Bold Italic
font_size        11.5

# Shell: zsh when installed (component "Shell: zsh + starship"), otherwise your login shell
shell sh -c 'command -v zsh >/dev/null 2>&1 && exec zsh || exec "${SHELL:-/bin/sh}"'

# Window styling & geometry
window_padding_width 10 12
confirm_os_window_close 0
# 0.85 over the native blur (decoration.blur). It is the client's own alpha: it cannot know about
# fullscreen, so use a fullscreen kitty sparingly or press the shortcut for opacity 1 (dynamic_background_opacity).
background_opacity 0.85
dynamic_background_opacity yes

# Cursor
cursor            #c50ed2
cursor_text_color #0b0c14
cursor_shape      beam
cursor_blink_interval 0.5

# Selection
selection_foreground #ffffff
selection_background #7c3aed

# URL styling
url_color #00c1e4
url_style curly
open_url_with default

# Palette (Sweet / Garuda Dragonized)
foreground #e6e8ef
background #0b0c14

# black
color0 #161925
color8 #3a3d55

# red
color1 #ed254e
color9 #f15274

# green
color2  #06c993
color10 #2fdba9

# yellow
color3  #f9ae58
color11 #fbc27f

# blue (violet)
color4  #7c3aed
color12 #945df0

# magenta (accent)
color5  #c50ed2
color13 #db3fe6

# cyan
color6  #00c1e4
color14 #38d3ef

# white
color7  #c3c7d1
color15 #e6e8ef

# Tab bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #e6e8ef
active_tab_background   #7c3aed
active_tab_font_style   bold
inactive_tab_foreground #8a8fa3
inactive_tab_background #161925
