# dragon-island — starship prompt (the user's own colors, restored after the Dragonized mapping of migration 002).
add_newline = true
command_timeout = 200
#format = "$os$username$hostname${custom.location}$directory$git_branch$git_state$git_status$nodejs$deno$bun$python$rust$golang$java$kotlin$php$ruby$lua$c$dart$elixir$haskell$swift$zig$docker_context$package$kubernetes$terraform$aws$nix_shell$conda$character"
format = "$username$hostname${custom.location}$directory$git_branch$git_state$git_status$nodejs$deno$bun$python$rust$golang$java$kotlin$php$ruby$lua$c$dart$elixir$haskell$swift$zig$docker_context$package$kubernetes$terraform$aws$nix_shell$conda$character"
right_format = "$status$cmd_duration$jobs$time"

[os]
disabled = false
format = "[$symbol](bold #30C0FF) "

[os.symbols]
Arch = ""
Linux = ""

[username]
show_always = true
format = "[$user](bold #F04DFF) "

[hostname]
ssh_only = true
format = "[󰒋 $hostname](bold #FFB644) "

[character]
error_symbol = "[✗](bold #FF3D48)"
success_symbol = "[❯❯](bold #70FF58)"

[custom.location]
command = 'if [ "$PWD" = "$HOME" ]; then printf ""; else printf "󰉋"; fi'
when = "true"
format = "[$output](bold #22EEF7) "

[directory]
truncation_length = 2
truncation_symbol = "…/"
home_symbol = "~"
read_only = "󰌾"
style = "bold #FF426D"
format = "[$path]($style)[$read_only]($read_only_style) "
repo_root_style = "bold #FF426D"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[ $branch]($style) "
style = "italic #22EEF7"

[git_state]
format = "[󰘬 $state( $progress_current/$progress_total)]($style) "
style = "bold #FFEB65"

[git_status]
format     = '[$all_status]($style)'
style      = "#22EEF7"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✗ "
style = "bold #FF3D48"

[cmd_duration]
min_time = 500
format = "[󰔛 $duration]($style) "
style = "#FFB644"

[jobs]
format = "[$symbol$number]($style) "
symbol = "󰜎 "
style = "#30C0FF"
number_threshold = 1
symbol_threshold = 1

[time]
disabled = false
time_format = "%H:%M"
format = "[ $time]($style)"
style = "dimmed #22EEF7"
