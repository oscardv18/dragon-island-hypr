# =============================================================================
# dragon-island — hypridle.conf (FALLBACK)
# The session runs `dragon-idle run` (autostart.lua), which generates ~/.local/state/dragon-island/hypridle.conf from
# the times in settings.json (Ajustes › Energía). This file is only used if dragon-idle is missing; same defaults.
# =============================================================================

general {
    lock_cmd = pidof hyprlock || qs ipc call lock lock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 2
}

# 1. Warn in the island and dim the screen after 4 minutes (Quickshell, no backlight change)
listener {
    timeout = 240
    on-timeout = qs ipc call idle warn
    on-resume = qs ipc call idle resume
}

# 2. Lock after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. Turn off displays after 5.5 minutes
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 4. Suspend after 20 minutes
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
