# =============================================================================
# dragon-island — hyprpaper.conf
# =============================================================================

splash = false
ipc = true

# Wallpaper for every monitor (fallback block).
# The installer links ~/.local/share/dragon-island/wallpaper.jpg to the default
# (assets/wallpapers/dragon-island.jpg) only if that file does not exist yet.
# To use your own: replace that file with any JPEG, or change `path` below.
wallpaper {
    monitor =
    path = ~/.local/share/dragon-island/wallpaper.jpg
    fit_mode = cover
}
