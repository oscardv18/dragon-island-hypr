# =============================================================================
# dragon-island — hyprqt6engine (Qt6 platform theme for the Hyprland session)
# QT_QPA_PLATFORMTHEME=hyprqt6engine is set in env.lua (hl.env), only in this session; Plasma keeps its own.
# Options checked in the installed plugin: theme:{color_scheme, icon_theme, style, font, font_size,
# font_fixed, font_fixed_size} and misc:{single_click_activate, menus_have_icons, shortcuts_for_context_menus}.
# =============================================================================

theme {
    # Candy icons + Sweet Folders (Sweet-Purple Inherits candy-icons, then breeze-dark / Adwaita / hicolor)
    icon_theme = Sweet-Purple
    # There is no Sweet color scheme on this system (only Breeze*): the dark Breeze one keeps Dolphin dark,
    # like the GTK side (Breeze, prefer-dark). Without a scheme Qt falls back to a light palette.
    color_scheme = /usr/share/color-schemes/BreezeDark.colors
    style = breeze
    font = Noto Sans
    font_size = 10
    font_fixed = JetBrains Mono Nerd Font
    font_fixed_size = 10
}

misc {
    single_click_activate = false
    menus_have_icons = true
    shortcuts_for_context_menus = true
}
