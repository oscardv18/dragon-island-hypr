# =============================================================================
# dragon-island — hyprlock.conf  (respaldo del bloqueo de Quickshell; misma paleta "dragon-core")
# bg #05060c · magenta #c50ed2 · violeta #7c3aed · cian #00c1e4 · error #ed254e
# hyprlock no anima: el fondo es una captura estática del núcleo neural (assets/core.png).
# =============================================================================

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/hypr/assets/core.png
    color = rgba(5, 6, 12, 1.0) # #05060c
    blur_passes = 0
}

# Clock (Hours & Minutes)
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(230, 232, 239, 1.0) # text #e6e8ef
    font_size = 72
    font_family = JetBrains Mono Nerd Font 600
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
}

# Date formatted in Spanish
label {
    monitor =
    text = cmd[update:60000] LC_TIME=es_ES.UTF-8 date +"%A, %d de %B de %Y"
    color = rgba(195, 199, 209, 1.0) # textSoft #c3c7d1
    font_size = 16
    font_family = Outfit Medium
    position = 0, 60
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}

# Password Input Field — dark glass, rounded
input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1 # full rounding

    inner_color = rgba(5, 6, 12, 0.72) # #05060c, glass
    outer_color = rgba(197, 14, 210, 1.0) rgba(124, 58, 237, 1.0) 135deg # magenta -> violet
    font_color = rgba(230, 232, 239, 1.0) # text #e6e8ef

    check_color = rgba(0, 193, 228, 1.0) rgba(124, 58, 237, 1.0) 135deg # cyan -> violet
    fail_color = rgba(237, 37, 78, 1.0) rgba(237, 37, 78, 1.0) 135deg # error #ed254e
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    fade_on_empty = false
    rounding = 24
    placeholder_text = <span foreground="##8a8fa3">Contraseña...</span>
    hide_input = false

    position = 0, -40
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Keyboard layout in use. hyprlock takes the keymap from Hyprland (kb_layout us,latam), so Alt+Shift
# switches here too: type ñ and accents with "Spanish (Latin American)".
label {
    monitor =
    text = $LAYOUT
    color = rgba(0, 193, 228, 1.0) # cyan #00c1e4
    font_size = 12
    font_family = Outfit
    position = 0, -130
    halign = center
    valign = center
}

# User display
label {
    monitor =
    text = Hola, $USER
    color = rgba(138, 143, 163, 1.0) # textDim #8a8fa3
    font_size = 14
    font_family = Outfit
    position = 0, -100
    halign = center
    valign = center
}
