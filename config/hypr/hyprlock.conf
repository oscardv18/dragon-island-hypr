# =============================================================================
# dragon-island — hyprlock.conf
# Sweet / Garuda Dragonized palette
# =============================================================================

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.cache/dragon-island/current-wallpaper   # kept by the wallpaper service (a frame for GIF / video)
    color = rgba(11, 12, 20, 1.0) # #0b0c14 bg
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.05
}

# Clock (Hours & Minutes)
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(230, 232, 239, 1.0) # text #e6e8ef
    font_size = 72
    font_family = JetBrains Mono Nerd Font 600
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
}

# Date formatted in Spanish
label {
    monitor =
    text = cmd[update:60000] LC_TIME=es_ES.UTF-8 date +"%A, %d de %B de %Y"
    color = rgba(195, 199, 209, 1.0) # textSoft #c3c7d1
    font_size = 16
    font_family = Outfit Medium
    position = 0, 60
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}

# Password Input Field
input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1 # full rounding

    inner_color = rgba(22, 25, 37, 0.85) # surface0 #161925
    outer_color = rgba(197, 14, 210, 1.0) rgba(124, 58, 237, 1.0) 135deg # accent -> violet
    font_color = rgba(230, 232, 239, 1.0) # text #e6e8ef

    check_color = rgba(0, 193, 228, 1.0) rgba(124, 58, 237, 1.0) 135deg # cyan -> violet
    fail_color = rgba(237, 37, 78, 1.0) rgba(249, 174, 88, 1.0) 135deg # error -> warn
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    fade_on_empty = false
    rounding = 14
    placeholder_text = <span foreground="##8a8fa3">Contraseña...</span>
    hide_input = false

    position = 0, -40
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Keyboard layout in use. hyprlock takes the keymap from Hyprland (kb_layout us,latam), so Alt+Shift
# switches here too: type ñ and accents with "Spanish (Latin American)".
label {
    monitor =
    text = $LAYOUT
    color = rgba(138, 143, 163, 1.0) # textDim #8a8fa3
    font_size = 12
    font_family = Outfit
    position = 0, -130
    halign = center
    valign = center
}

# User display
label {
    monitor =
    text = Hola, $USER
    color = rgba(138, 143, 163, 1.0) # textDim #8a8fa3
    font_size = 14
    font_family = Outfit
    position = 0, -100
    halign = center
    valign = center
}
