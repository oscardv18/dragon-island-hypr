# dragon-island — arreglos de dispositivos de audio USB (snd-usb-audio). Se instala en /etc/modprobe.d/.
#
# Audífonos USB con chip Jieli «UACDemoV1.0» (4c4a:4155): el micrófono manda paquetes de captura mayores que los que
# Linux calcula para 48 kHz mono, cada paquete acaba en -75 (EOVERFLOW) y la grabación se corta sin una muestra.
# Windows reserva siempre wMaxPacketSize y por eso allí funciona. El kernel ya trae ese mismo arreglo (fill_max:
# paquetes de wMaxPacketSize) para otro chip Jieli, 1224:2a25: quirk_alias se lo aplica a este. quirk_flags le quita a
# ese alias MIC_RES_16, que dejaría el volumen del micrófono en ~6 pasos en vez de 99.
# Solo afecta a esos dos ID. Se aplica al conectar el dispositivo después de reiniciar (o al recargar snd-usb-audio).
options snd-usb-audio quirk_alias=4c4a4155:12242a25 quirk_flags=1224:2a25:!mic_res_16
