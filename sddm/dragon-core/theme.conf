[General]
# Wallpaper behind everything (blurred again and veiled). background.jpg ships blurred; bin/dragon-sddm-sync
# replaces it with your current wallpaper. An absolute path readable by the sddm user also works.
background=background.jpg
# 0–1: how dark the veil over the wallpaper is
veil=0.62
# Sphere nodes: lower if the greeter feels slow (160 is light, 320 is dense)
pointCount=240
# true = slow breathing, no spin
reducedMotion=false
# Keyboard layout forced at start (index in the X11/Wayland layout list; 0 = us)
defaultLayoutIndex=0
locale=es_VE
fontUi=Outfit
fontMono=JetBrains Mono
