[General]
# Wallpaper behind everything, shown as is under the veil. bin/dragon-sddm-sync writes background.png from your current
# wallpaper (1920×1080, blurred once by it); until then the theme's background.jpg is used. An absolute path readable
# by the sddm user also works.
background=background.png
# Blur that dragon-sddm-sync gives the wallpaper (gaussian sigma in px at 1920×1080): 0 = sharp, 12 = soft,
# 32 = strong. Run dragon-sddm-sync again after changing it
background_blur=12
# 0–1: how dark the veil over the wallpaper is in the middle (towards the edges it gets darker)
veil=0.62
# 0–0.2: grain over the veil (noise.png, tiled) that hides its colour banding; 0 = off
noise=0.03
# Sphere nodes: lower if the greeter feels slow (160 is light, 320 is dense)
pointCount=240
# true = slow breathing, no spin
reducedMotion=false
# Keyboard layout forced at start (index in the X11/Wayland layout list; 0 = us)
defaultLayoutIndex=0
locale=es_VE
fontUi=Outfit
fontMono=JetBrains Mono
